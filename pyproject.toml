[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-flow"
version = "0.2.0"
description = "Editor visual low-code para agentes de IA com PyReact e LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "langgraph>=1.0,<2.0",
    "httpx>=0.27",
    "pyreact-framework>=1.0.5",
    "uikitpr>=0.3.2",
    "6cons>=0.1.0",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "psycopg[binary]>=3.2",
    "pyodbc>=5.2",
    "sqlalchemy-bigquery>=1.12",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "cryptography>=42.0",
    "Pillow>=10.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]
self-hosted = [
    "torch>=2.7",
    "torchvision>=0.22",
    "torchaudio>=2.7",
    "huggingface-hub>=0.34",
    "transformers==5.14.1",
    "accelerate>=1.9",
    "diffusers>=0.34",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "soundfile>=0.13",
    "trimesh>=4.7",
]
rocm = [
    "rocm==7.14.0",
    "rocm-bootstrap==0.1.0",
    "rocm-sdk-core==7.14.0",
    "rocm-sdk-libraries==7.14.0",
    "torch[device-all]==2.12.0+rocm7.14.0",
    "torchaudio==2.11.0+rocm7.14.0",
    "torchvision[device-all]==0.27.0+rocm7.14.0",
]

[project.scripts]
agentic-flow = "agentic_flow.main:run"

[tool.setuptools.packages.find]
include = ["agentic_flow*"]

[tool.setuptools.package-data]
agentic_flow = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
