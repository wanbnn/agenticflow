[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticflow-studio"
version = "0.3.0"
description = "Plataforma visual self-hosted para agentes e modelos locais de IA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "wanbnn"}]
keywords = ["agents", "llm", "workflow", "huggingface", "rocm", "cuda", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "langgraph>=1.0,<2.0",
    "httpx>=0.27",
    "pyreact-framework>=1.0.5",
    "uikitpr>=0.3.2",
    "6cons>=0.1.0",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "psycopg[binary]>=3.2",
    "pyodbc>=5.2",
    "sqlalchemy-bigquery>=1.12",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "cryptography>=42.0",
    "Pillow>=10.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]
self-hosted = [
    "torch>=2.7",
    "torchvision>=0.22",
    "torchaudio>=2.7",
    "huggingface-hub>=0.34",
    "transformers==5.14.1",
    "accelerate>=1.9",
    "diffusers>=0.34",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "soundfile>=0.13",
    "trimesh>=4.7",
]
self-hosted-runtime = [
    "huggingface-hub>=0.34",
    "transformers==5.14.1",
    "accelerate>=1.9",
    "diffusers>=0.34",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "soundfile>=0.13",
    "trimesh>=4.7",
]
rocm = [
    "rocm==7.14.0",
    "rocm-bootstrap==0.1.0",
    "rocm-sdk-core==7.14.0",
    "rocm-sdk-libraries==7.14.0",
    "torch[device-all]==2.13.0+rocm7.14.0",
    "torchaudio==2.11.0+rocm7.14.0",
    "torchvision[device-all]==0.27.0+rocm7.14.0",
]

[project.scripts]
agenticflow = "agentic_flow.cli:main"
agentic-flow = "agentic_flow.cli:main"

[project.urls]
Homepage = "https://github.com/wanbnn/agenticflow"
Repository = "https://github.com/wanbnn/agenticflow"
Issues = "https://github.com/wanbnn/agenticflow/issues"
Changelog = "https://github.com/wanbnn/agenticflow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["agentic_flow*"]

[tool.setuptools.package-data]
agentic_flow = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
