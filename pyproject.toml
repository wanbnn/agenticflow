[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-flow"
version = "0.2.0"
description = "Editor visual low-code para agentes de IA com PyReact e LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "langgraph>=1.0,<2.0",
    "openai>=2.0",
    "httpx>=0.27",
    "pyreact-framework>=1.0.5",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
agentic-flow = "agentic_flow.main:run"

[tool.setuptools.packages.find]
include = ["agentic_flow*"]

[tool.setuptools.package-data]
agentic_flow = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
